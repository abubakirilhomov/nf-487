<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Погода</title>
    <meta name="description" content="Погода и прогноз для любого города мира" />
    <meta name="theme-color" content="#1C2559" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Погода" />
  </head>
  <body>
    <!-- Общие градиенты для SVG-иконок погоды -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <radialGradient id="g-sun" cx="40%" cy="35%" r="70%">
          <stop offset="0" stop-color="#FFF4C2" />
          <stop offset=".55" stop-color="#FFC94D" />
          <stop offset="1" stop-color="#FF9A3C" />
        </radialGradient>
        <linearGradient id="g-moon" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF" />
          <stop offset="1" stop-color="#C9D3FF" />
        </linearGradient>
        <linearGradient id="g-cloud" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="48">
          <stop offset="0" stop-color="#FFFFFF" />
          <stop offset="1" stop-color="#C8D6EA" />
        </linearGradient>
        <linearGradient id="g-cloud-dark" gradientUnits="userSpaceOnUse" x1="0" y1="16" x2="0" y2="48">
          <stop offset="0" stop-color="#B7C2D6" />
          <stop offset="1" stop-color="#6E7C96" />
        </linearGradient>
        <linearGradient id="g-bolt" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFE98A" />
          <stop offset="1" stop-color="#FFB02E" />
        </linearGradient>
      </defs>
    </svg>

    <!-- Фон: градиент + светящиеся «ионные» сферы + частицы -->
    <div id="bg" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <canvas id="particles"></canvas>
      <div id="flash"></div>
      <div class="grain"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
